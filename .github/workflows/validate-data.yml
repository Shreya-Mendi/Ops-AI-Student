name: Validate NYC Taxi Demand Data

on:
  schedule:
    - cron: '0 * * * *'  # Hourly — taxi demand shifts within hours; daily validation misses intraday corruption
  push:
    branches: [main]
    paths:
      - 'week3/data/**'
      - 'week3/validation/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas pyarrow numpy

      - name: Run data quality validation
        id: validate
        run: cd week3 && python3 -m validation.check_data_quality data/

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: week3/validation-results.json

      - name: Print validation summary
        if: success()
        run: |
          echo "============================================"
          echo " Data quality validation PASSED"
          echo "============================================"
          if [ -f week3/validation-results.json ]; then
            python3 -c "
import json
with open('week3/validation-results.json') as f:
    r = json.load(f)
print(f'  Checks run  : {r.get(\"checks_run\", \"n/a\")}')
print(f'  Issues found: {r.get(\"num_issues\", 0)}')
print(f'  Status      : {r.get(\"status\", \"ok\")}')
"
          fi

      - name: Print failure details and block deployment
        if: failure()
        run: |
          echo "============================================"
          echo " Data quality validation FAILED"
          echo " Deployment is BLOCKED"
          echo "============================================"
          if [ -f week3/validation-results.json ]; then
            python3 -c "
import json
with open('week3/validation-results.json') as f:
    r = json.load(f)
issues = r.get('issues', [])
print(f'Total issues: {len(issues)}')
for i, issue in enumerate(issues, 1):
    print(f'  [{i}] type={issue.get(\"type\")} severity={issue.get(\"severity\")} count={issue.get(\"count\")}')
    print(f'       {issue.get(\"description\", \"\")}')
"
          else
            echo "  validation-results.json not found — check the validation step logs above."
          fi
          exit 1
