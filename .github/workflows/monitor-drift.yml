name: Drift Monitoring

# Schedule: daily at midnight UTC.
# Justification: NYC taxi demand has 24h ground truth lag (actuals finalized next day),
# so monitoring more frequently than daily provides no additional signal. Daily runs
# balance detection lag vs. CI cost, and give ops a clear morning action window.
on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  push:
    branches: [week4, main]
    paths:
      - 'week4/data/**'
      - 'week4/scripts/**'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas==2.2.2 pyarrow==16.1.0 numpy==1.26.4 scipy==1.13.1 scikit-learn==1.4.2 pytest

      - name: Run monitoring tests
        run: |
          cd week4
          python3 -m pytest scripts/test_monitoring.py -v

      - name: Compute monitoring metrics
        id: metrics
        run: |
          cd week4
          python3 scripts/compute_metrics.py
        continue-on-error: true

      - name: Detect drift patterns
        id: drift
        run: |
          cd week4
          python3 scripts/detect_drift.py
        continue-on-error: true

      - name: Upload metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-metrics-${{ github.run_number }}
          path: |
            week4/metrics-*.json
            week4/drift-*.json

      - name: Create drift alert issue
        if: steps.metrics.outcome == 'failure' || steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Drift Alert',
              '',
              `**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              `**Triggered by:** ${{ github.event_name }}`,
              `**Branch:** ${{ github.ref_name }}`,
              '',
              '### Steps that failed',
              `- compute_metrics.py: ${{ steps.metrics.outcome }}`,
              `- detect_drift.py: ${{ steps.drift.outcome }}`,
              '',
              '### Recommended actions',
              '1. Download the `monitoring-metrics` artifact and inspect `metrics-*.json` and `drift-*.json`',
              '2. Check which drift patterns were confirmed in the drift report',
              '3. Assess whether retraining is needed (PSI > 0.25 or accuracy < 70%)',
              '4. If retraining triggered: retrain on last 30 days, validate offline, deploy if accuracy >= current',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Drift Alert] Monitoring detected issues on ${new Date().toISOString().slice(0,10)}`,
              body: body,
              labels: ['drift-alert', 'ops']
            });

      - name: Monitoring complete
        if: steps.metrics.outcome == 'success' && steps.drift.outcome == 'success'
        run: echo "Drift monitoring complete -- no critical issues detected"
